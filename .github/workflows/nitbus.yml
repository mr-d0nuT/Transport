name: Actualiza horarios del NitBus

on:
  schedule:
    - cron: '50 4 * * 2'   # martes 04:50 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerar nitbus.json desde el GTFS de AMB
        run: python3 scripts/build_nitbus.py
      - name: Comprobar que el resultado tiene sentido
        run: |
          python3 - <<'PY'
          import json, sys
          d = json.load(open('nitbus.json'))
          print(f"{len(d['lines'])} líneas, {len(d['stops'])} paradas, {len(d['trips'])} viajes")
          # la red nocturna son ~24 líneas: bastante menos es un GTFS a medias
          if len(d['lines']) < 18 or len(d['trips']) < 600:
              sys.exit('Datos incompletos: no se commitea')
          PY
      - name: Commit si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nitbus.json
          git diff --cached --quiet && echo "Sin cambios" || git commit -m "Horarios del NitBus actualizados (GTFS AMB)"
          git push
