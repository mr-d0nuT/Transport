name: Actualiza los andenes del metro

on:
  schedule:
    - cron: '40 4 1 * *'   # el día 1 de cada mes, 04:40 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerar andenes-metro.json desde OpenStreetMap
        run: python3 scripts/build_andenes.py
      - name: Comprobar que el resultado tiene sentido
        run: |
          python3 - <<'PY'
          import json, sys
          d = json.load(open('andenes-metro.json'))
          n = len(d['s'])
          andenes = sum(len(s['p']) for s in d['s'])
          print(f'{n} estaciones, {andenes} andenes')
          # el metro de Barcelona tiene ~160 estaciones: si salen muchas menos,
          # es que Overpass ha devuelto datos a medias y no queremos commitear eso
          if n < 140 or andenes < 170:
              sys.exit(f'Datos incompletos ({n} estaciones, {andenes} andenes): no se commitea')
          PY
      - name: Commit si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add andenes-metro.json
          git diff --cached --quiet && echo "Sin cambios" || git commit -m "Andenes del metro actualizados (OpenStreetMap)"
          git push
